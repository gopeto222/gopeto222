name: Validate profile
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Generated assets
        run: |
          python3 scripts/metrics.py --validate
          python3 scripts/visuals.py
          git diff --exit-code -- assets/generated
      - name: SVG and local links
        run: python3 scripts/qa.py
