name: Validate profile
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Python syntax
        run: python3 -m compileall -q scripts tests
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Generated assets
        run: |
          python3 scripts/metrics.py --validate
          python3 scripts/visuals.py
          git diff --exit-code -- assets/generated
      - name: SVG and local links
        run: python3 scripts/qa.py
