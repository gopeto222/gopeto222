name: Profile metrics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
permissions:
  contents: read
concurrency:
  group: profile-metrics
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test generator
        run: python3 -m unittest discover -s tests -v
      - name: Generate metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/metrics.py
      - name: Validate generated assets
        run: |
          python3 scripts/metrics.py --validate
          python3 scripts/visuals.py
          python3 scripts/build_readmes.py
          git diff --exit-code -- assets/generated README.md README.bg.md
          python3 scripts/qa.py
      - name: Commit changed metrics
        run: |
          if git diff --quiet -- data/activity.json assets/metrics; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/activity.json assets/metrics
          git commit -m 'chore(metrics): refresh public activity card'
          git push
