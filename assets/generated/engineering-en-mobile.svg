if" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Clear trust boundaries</text><path d="M50 528L63 528" stroke="#8B5CF6" stroke-width="2" fill="none"/><text x="70" y="534" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Modular components</text><path d="M50 567L63 567" stroke="#8B5CF6" stroke-width="2" fill="none"/><text x="70" y="573" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Traceable data flow</text><rect x="304" y="370" width="260" height="260" rx="14" fill="#111C2D" stroke="#22C55E"/><text x="324" y="414" fill="#22C55E" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start" letter-spacing="0">04</text><text x="324" y="458" fill="#22C55E" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">SHIPPING</text><path d="M324 489L337 489" stroke="#22C55E" stroke-width="2" fill="none"/><text x="344" y="495" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Git and review</text><path d="M324 528L337 528" stroke="#22C55E" stroke-width="2" fill="none"/><text x="344" y="534" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Tests and CI</text><path d="M324 567L337 567" stroke="#22C55E" stroke-width="2" fill="none"/><text x="344" y="573" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Recovery paths</text></g></svg>
