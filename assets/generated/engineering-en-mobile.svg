<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 690" role="img" aria-labelledby="title desc"><title id="title">Engineering principles</title><desc id="desc">Engineering principles — AstroByte Development portfolio visual.</desc><defs><linearGradient id="shell" x2="1" y2="1"><stop stop-color="#111C2D"/><stop offset=".58" stop-color="#090F1B"/><stop offset="1" stop-color="#121C36"/></linearGradient><radialGradient id="glow"><stop stop-color="#3B82F6" stop-opacity=".30"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></radialGradient><linearGradient id="accent"><stop stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/></linearGradient><clipPath id="clip"><rect width="600" height="690" rx="24"/></clipPath></defs><rect width="600" height="690" rx="24" fill="url(#shell)"/><rect x="1" y="1" width="598" height="688" rx="23" fill="none" stroke="#344B67"/><path d="M24 1H576" stroke="url(#accent)" opacity=".78"/><g clip-path="url(#clip)"><text x="30" y="45" fill="#22D3EE" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start" letter-spacing="2">05 / HOW I BUILD</text><rect x="30" y="70" width="260" height="260" rx="14" fill="#111C2D" stroke="#EF4444"/><text x="50" y="114" fill="#EF4444" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="800" text-anchor="start" letter-spacing="0">01</text><text x="50" y="158" fill="#EF4444" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">SECURITY</text><path d="M50 189L63 189" stroke="#EF4444" stroke-width="2" fill="none"/><text x="70" y="195" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">Validate server input</text><path d="M50 228L63 228" stroke="#EF4444" stroke-width="2" fill="none"/><text x="70" y="234" fill="#F2F6FF" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="400" text-anchor="start" le